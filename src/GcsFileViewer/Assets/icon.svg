<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6FB1FF"/>
      <stop offset="0.55" stop-color="#3B7BF6"/>
      <stop offset="1" stop-color="#1B3FC4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A928"/>
      <stop offset="1" stop-color="#E88C12"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFBE3D"/>
    </linearGradient>
    <linearGradient id="pail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D5E2FA"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#BFD0F2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE7FB"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8DFA"/>
      <stop offset="1" stop-color="#2456D6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <g clip-path="url(#tile)">
   <g transform="translate(0 -34)">
    <!-- Soft shadow the bucket casts on the tile -->
    <ellipse cx="512" cy="812" rx="250" ry="34" fill="#0B1E6B" opacity="0.35"/>

    <!-- Folder standing in the bucket: back panel with tab, a sheet of paper, front panel -->
    <path d="M318 318 q0 -34 34 -34 h118 q18 0 30 13 l30 33 h142 q34 0 34 34 v250 h-388 z" fill="url(#folderBack)"/>
    <rect x="352" y="352" width="320" height="230" rx="16" fill="#FFFFFF"/>
    <rect x="384" y="386" width="170" height="16" rx="8" fill="#C9D8F5"/>
    <rect x="384" y="420" width="240" height="16" rx="8" fill="#DCE6F8"/>
    <path d="M304 446 q0 -30 30 -30 h356 q30 0 30 30 v174 h-416 z" fill="url(#folderFront)"/>
    <rect x="322" y="416" width="380" height="8" rx="4" fill="#FFF3B8" opacity="0.9"/>

    <!-- Bucket -->
    <path d="M262 520 h500 l-46 262 q-7 40 -48 40 h-312 q-41 0 -48 -40 z" fill="url(#pail)"/>
    <path d="M262 520 h500 l-7 40 h-486 z" fill="#1B3FC4" opacity="0.16"/>
    <rect x="232" y="468" width="560" height="74" rx="37" fill="url(#rim)"/>
    <rect x="232" y="468" width="560" height="74" rx="37" fill="none" stroke="#B7C9EE" stroke-width="4"/>

    <!-- Cloud on the bucket -->
    <path d="M420 728 a52 52 0 0 1 4 -104 a78 78 0 0 1 148 -18 a60 60 0 0 1 36 122 z" fill="url(#cloud)"/>
   </g>
  </g>

  <!-- Edge highlight on the tile -->
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
</svg>
